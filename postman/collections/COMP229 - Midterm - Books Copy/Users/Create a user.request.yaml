$kind: http-request
url: http://localhost:3000/api/users
method: POST
body:
  type: json
  content: |-
    {
        "firstname": "Clark",
        "lastname": "Kent",
        "email": "clark.kent@dailyplanet.com",    
        "password": "12345678",
        "username": "clark.kent"
    }
scripts:
  - type: afterResponse
    code: |-
      let jsonData = pm.response.json();
      pm.environment.set("userId", jsonData.data.id);
    language: text/javascript
order: 1000
